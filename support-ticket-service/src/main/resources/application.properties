server.port=8080
spring.application.name=support-ticket-service

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5437/helpflow}
spring.datasource.username=${DB_USER:helpflow}
spring.datasource.password=${DB_PASSWORD:helpflow}

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.helpflow=INFO

# JWT (se usa cuando agreguemos jjwt)
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-de-minimo-32-caracteres-seguros}
app.jwt.expiration-minutes=60

# technician-dispatch-service (se usa al final)
app.dispatch.base-url=${DISPATCH_URL:http://localhost:8081}
app.dispatch.timeout-ms=3000

# Admin credentials
app.admin.username=admin@gmail.com
app.admin.password=${ADMIN_PASSWORD:admin123}