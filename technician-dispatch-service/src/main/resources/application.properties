server.port=8081
spring.application.name=technician-dispatch-service

management.endpoints.web.exposure.include=health,info
info.app.name=technician-dispatch-service
info.app.description=Servicio simulado de disponibilidad técnica de HelpFlow

logging.level.com.helpflow=INFO

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs